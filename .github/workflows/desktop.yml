name: Desktop checks and packages
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e "./perch[dev]"
      - run: ruff check perch
      - run: node --check perch/src/perch/static/app.js
      - name: Unit and process tests
        run: python -m unittest discover -s perch/tests -v
      - name: Build desktop bundle
        run: python -m PyInstaller perch/packaging/perch.spec --noconfirm --distpath perch/dist --workpath perch/build
      - name: Validate packaged CLI on macOS
        if: runner.os == 'macOS'
        run: |
          perch/dist/Perch.app/Contents/MacOS/perch-cli --version
          python perch/scripts/check_packaged.py perch/dist/Perch.app/Contents/MacOS/perch-cli
      - name: Validate packaged CLI on Windows
        if: runner.os == 'Windows'
        run: |
          perch/dist/Perch/perch-cli.exe --version
          python perch/scripts/check_packaged.py perch/dist/Perch/perch-cli.exe
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent perch/dist/Perch.app perch/dist/Perch-macOS.zip
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" perch/packaging/windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Perch-${{ runner.os }}
          path: |
            perch/dist/Perch-macOS.zip
            perch/dist/Perch-Setup.exe
          if-no-files-found: error
