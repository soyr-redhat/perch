name: Desktop checks and packages
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: node --check static/app.js
      - name: Unit and process tests
        run: python -m unittest discover -v
      - name: Build desktop bundle
        run: python -m PyInstaller packaging/perch.spec --noconfirm
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Perch.app dist/Perch-macOS.zip
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Perch-${{ runner.os }}
          path: |
            dist/Perch-macOS.zip
            dist/Perch-Setup.exe
          if-no-files-found: error
