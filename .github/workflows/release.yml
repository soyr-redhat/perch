name: Publish desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: Perch-macOS-arm64.zip
          - os: windows-latest
            asset: Perch-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e "./perch[dev]"
      - run: npm ci --prefix perch/frontend
      - run: npm run --prefix perch/frontend build
      - run: git diff --exit-code -- perch/src/perch/static
      - run: npm run --prefix perch/frontend test
      - run: ruff check perch
      - run: node --check perch/src/perch/static/app.js
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('perch/install.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - run: python -m unittest discover -s perch/tests -v
      - run: python -m PyInstaller perch/packaging/perch.spec --noconfirm --distpath perch/dist --workpath perch/build
      - name: Validate packaged CLI on macOS
        if: runner.os == 'macOS'
        run: |
          perch/dist/Perch.app/Contents/MacOS/perch-cli --version
          python perch/scripts/check_packaged.py perch/dist/Perch.app/Contents/MacOS/perch-cli
      - name: Validate packaged CLI on Windows
        if: runner.os == 'Windows'
        run: |
          perch/dist/Perch/perch-cli.exe --version
          python perch/scripts/check_packaged.py perch/dist/Perch/perch-cli.exe
      - name: Package Apple silicon application
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          ditto -c -k --sequesterRsrc --keepParent perch/dist/Perch.app perch/dist/Perch-macOS-arm64.zip
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" perch/packaging/windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: perch/dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Assemble checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for asset in Perch-*; do
            sha256sum "$asset" >> SHA256SUMS
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Perch-macOS-arm64.zip
            release/Perch-Setup.exe
            release/SHA256SUMS
