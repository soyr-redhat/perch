<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perch</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="workspace">
  <aside class="sidebar">
    <div class="brand"><img src="/icon.svg" alt="" width="29" height="29"><strong>Perch</strong></div>
    <nav class="primary-nav"><button id="resources-nav" class="active">Resources <span id="tools-count"></span></button><button id="conversations-nav">Conversations</button></nav><button id="new-session" class="new-session" hidden>Open terminal…</button>
    <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find a session…" aria-label="Search sessions"><kbd>⌘ K</kbd></label>
    <div class="filters" role="group" aria-label="Filter sessions"><button data-filter="all" aria-pressed="true">All</button><button data-filter="working">Active</button><button data-filter="waiting">Idle</button></div>
    <div class="session-list" id="sessions" aria-label="Sessions"></div>
    <nav class="sidebar-nav"><button id="settings-nav"><span aria-hidden="true">⚙</span> Settings</button></nav>
    <div class="connection"><span class="status-dot" id="connection-dot"></span><span id="connection-text">Connecting…</span><button id="retry" hidden>Reconnect</button></div>
  </aside>
  <div class="splitter" role="separator" tabindex="0" aria-label="Resize session pane" aria-orientation="vertical" aria-valuemin="230" aria-valuemax="460" aria-valuenow="290"></div>
  <main>
    <header class="toolbar"><div class="breadcrumb"><span id="view-label">Sessions</span><span class="divider">/</span><strong id="project-label">Your workspace</strong></div><button class="icon-button" id="theme" title="Change color theme" aria-label="Change color theme">◐</button></header>
    <div class="health" id="health" role="status" hidden></div>
    <section id="session-view" class="session-view" hidden>
      <div class="session-heading"><div><div class="eyebrow" id="harness-label">Sessions</div><h1 id="session-title">No session selected</h1><div class="session-meta" id="session-meta"></div></div><div class="session-actions" id="session-actions"></div></div>
      <div class="view-tabs" id="view-tabs" role="tablist" aria-label="Session views"></div>
      <div class="activity-view" id="activity-view">
        <div class="history-toolbar" id="history-toolbar" hidden><span id="history-caption">Recent activity</span></div>
        <div class="activity-timeline">
        <div class="feed" id="feed" tabindex="0" aria-label="Session activity"><div class="welcome"><img src="/icon.svg" width="52" height="52" alt=""><h2>No sessions yet</h2><button class="primary" id="welcome-new">Start a session</button><button class="text-button" id="welcome-tools">Resources</button></div></div>
          <div class="history-rail" id="history-rail">
            <div class="prompt-navigator" id="history" role="listbox" tabindex="0" aria-label="Prompt history" aria-orientation="vertical" aria-activedescendant="history-option">
              <div class="prompt-marks" id="history-marks" aria-hidden="true"></div>
              <span class="prompt-current" id="history-current" aria-hidden="true"></span>
              <div class="prompt-preview" id="history-preview"><div id="history-option" role="option" aria-selected="false"></div><small id="history-position" aria-hidden="true"></small></div>
            </div>
            <button id="history-live" aria-label="Back to live" title="Back to live" disabled>↓</button>
          </div>
        </div>
        <button class="follow-button" id="follow" hidden>↓ New activity</button>

      </div>
      <div class="terminal-view" id="terminal-view" hidden><div class="terminal-status" id="terminal-status"></div><div class="terminal-mount" id="terminal-mount"></div></div>
    </section>
    <section id="tools-view" class="tools-view">
      <div class="page-heading"><div><h1>Resources</h1></div><button class="primary" id="preview-sync">Review sharing</button></div>

      <div class="resource-controls">
        <div class="tools-tabs" role="group" aria-label="Resource categories"><span class="category-indicator" aria-hidden="true"></span><button data-tooltab="all" class="selected" aria-pressed="true">All</button><button data-tooltab="skill" aria-pressed="false">Skills</button><button data-tooltab="mcp" aria-pressed="false">Tools</button><button data-tooltab="plugin" aria-pressed="false">Plugins</button></div>
        <div class="resource-utilities"><details class="action-menu resource-add"><summary aria-label="Add resource">＋</summary><div class="action-menu-items"><button data-create-resource="skill">Add skill</button><button data-create-resource="mcp">Add MCP server</button><button id="removed-resources">Removed items</button></div></details><button class="inline-action" id="toggle-resource-search" aria-label="Find a resource" aria-expanded="false" title="Find a resource (⌘ K)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><button class="inline-action refresh-action" id="refresh-tools" aria-label="Refresh resources" title="Refresh resources"><span aria-hidden="true">↻</span></button></div>
      </div>
      <div class="resource-find" id="resource-find" hidden><input id="resource-search" type="search" placeholder="Find a resource…" aria-label="Search resources"></div>
      <div id="resource-errors" role="status" hidden></div>
      <div class="resource-workspace" id="resource-workspace">
        <div class="resource-list-scroll" id="resource-list-scroll"><div id="resource-list" class="resource-list" aria-label="Resources"><span class="resource-indicator" aria-hidden="true" hidden></span><div id="resource-rows"></div></div></div>
        <section id="resource-detail" class="resource-detail" aria-label="Resource details"></section>
      </div>
    </section>
    <footer class="statusbar"><span id="watching">Discovering local sessions…</span><span id="mode-label">Local workspace</span></footer>
  </main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/editor.min.js"></script>
<script src="/app.js"></script>
</body></html>
